<title>The Eight Parties</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root{
  --ground:#F2F3EF; --surface:#FBFBFA; --sunk:#EAECE5;
  --ink:#1A1E1B; --ink-2:#565C55; --ink-3:#878D84;
  --rule:#D9DCD3; --rule-2:#C4C8BC;
  --accent:#26564E; --accent-soft:#DEE9E5; --accent-rule:#9CBDB4;
  --seg-off:#D5D9CE;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#141714; --surface:#1B1F1B; --sunk:#20241F;
  --ink:#E9EBE5; --ink-2:#A5ABA1; --ink-3:#7A8077;
  --rule:#31362F; --rule-2:#3E443C;
  --accent:#84C1B4; --accent-soft:#1F302C; --accent-rule:#3D5D56;
  --seg-off:#343A32;}}
:root[data-theme="dark"]{
  --ground:#141714; --surface:#1B1F1B; --sunk:#20241F;
  --ink:#E9EBE5; --ink-2:#A5ABA1; --ink-3:#7A8077;
  --rule:#31362F; --rule-2:#3E443C;
  --accent:#84C1B4; --accent-soft:#1F302C; --accent-rule:#3D5D56;
  --seg-off:#343A32;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;margin:0}
.page{max-width:880px;margin:0 auto;padding:56px 28px 120px}
h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.06;letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.deck{font-size:17px;color:var(--ink-2);max-width:63ch;margin:0 0 30px}
.deck em{font-style:italic;color:var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:13px 0;margin:0 0 34px}
.tally{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.tally b{color:var(--ink);font-weight:500}
.status{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.status.on{color:var(--accent)}
.status.warn{color:#8A3A2C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status.warn{color:#DE8B78}}
label.fl{display:block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
textarea,input.nm{width:100%;font-family:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:3px;padding:10px 12px;font-size:15px;line-height:1.6;resize:none}
textarea{display:block;overflow:hidden}
textarea:focus,input.nm:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea::placeholder{color:var(--ink-3)}
.docnote{margin:0 0 46px}
.card{border-top:2px solid var(--ink);padding:24px 0 34px}
.hd{display:flex;align-items:baseline;gap:14px}
.num{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-3);min-width:22px;padding-top:3px}
input.nm{font-family:var(--serif);font-size:31px;font-weight:400;letter-spacing:-.012em;padding:2px 6px;
  border-color:transparent;background:transparent;flex:1;min-width:0}
input.nm:hover{border-color:var(--rule-2)}
.edited{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent-rule);border-radius:2px;padding:2px 6px;white-space:nowrap}
.coords{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0 22px;padding-left:36px}
.co{display:flex;align-items:center;gap:9px}
.co .k{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.segs{display:flex;gap:2px}
.sg{width:15px;height:5px;background:var(--seg-off);border-radius:1px}
.sg.on{background:var(--accent)}
.co .v{font-size:13px;color:var(--ink-2)}
.body{padding-left:36px;display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:680px){.two{grid-template-columns:1fr}}
.rel{padding-left:36px;margin:20px 0 0;font-size:13.5px;color:var(--ink-2);
  background:var(--sunk);border-left:3px solid var(--rule-2);padding:11px 15px;margin-left:36px}
.rel b{font-weight:500;color:var(--ink)}
.rel .lb{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
.rel .row+.row{margin-top:7px}
.mine{background:var(--accent-soft);border-left:3px solid var(--accent);padding:13px 15px;margin-top:4px}
.mine label.fl{color:var(--accent)}
.mine textarea{background:var(--surface);border-color:var(--accent-rule)}
.tools{display:flex;padding-left:36px;margin-top:14px}
button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:none;padding:4px 0;color:var(--ink-3);cursor:pointer;border-bottom:1px solid transparent}
button:hover{color:var(--ink);border-bottom-color:var(--rule-2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:620px){.page{padding:36px 18px 90px}h1{font-size:34px}.coords,.body,.tools{padding-left:0}.rel{margin-left:0}}
</style>

<div class="page">
<h1>The eight parties</h1>
<p class="deck">Two ends on each of three axes — economy, morals, government power — gives eight corners, and every one of them is a party somebody has actually stood for election as. <em>Change any name you don't like. Your edits are saved as you type.</em></p>

<div class="bar">
  <span class="tally" id="tally"><b>8</b> parties</span>
  <span class="status" id="status">Connecting</span>
</div>

<div class="docnote">
  <label class="fl" for="docnote">Notes on the set as a whole</label>
  <textarea id="docnote" rows="2" placeholder="Names that don't sit right, a corner you'd rather define differently, anything about the eight together."></textarea>
</div>

<div id="list"></div>
</div>

<script>
const AXES=[["Economy",["collective","neo-liberal"]],["Morals",["conservative","progressive"]],["Government power",["authoritarian","libertarian"]]];
const DATA=[
{n:1,c:[0,0,0],name:"Union Party",
 desc:"Take the fortunes and share them out, keep the church and the family exactly where they are, and do not let anybody stand in the way of either. Economically radical and socially immovable.",
 from:"The Union Party (United States, 1936) — William Lemke's presidential run, carrying Huey Long's Share Our Wealth programme after Long's assassination, with Father Coughlin behind it.",
 also:"Justicialist Party (Argentina) — Perón's own party\nArab Socialist Ba'ath Party (Syria, Iraq)\nNational Union (Portugal) — Salazar's Estado Novo\nFalange Española"},
{n:2,c:[0,0,1],name:"People's Party",
 desc:"Land, credit and the grain elevator held in common by the people who use them; morals inherited and not up for discussion; and no authority above the county that anybody trusts.",
 from:"The People's Party (United States, 1892) — the Populists. Cooperatives, the sub-treasury plan, direct election of senators, and a deep suspicion of every distant power.",
 also:"The Nonpartisan League (North Dakota, 1915) — farmer-owned state banks and mills\nThe Distributist League (Britain, 1926) — Chesterton and Belloc\nThe Grange\nThe Catholic Worker Movement"},
{n:3,c:[0,1,0],name:"Communist Party",
 desc:"The state owns it, the future justifies it, and a disciplined minority decides what the future is. The most complete answer on offer, and it does not take questions.",
 from:"The Communist Party — the form taken by Lenin's vanguard everywhere it was copied, from the CPSU to the CPUSA.",
 also:"Communist Party of Cuba\nUnited Socialist Party of Venezuela\nSandinista National Liberation Front (Nicaragua)\nWorkers' Party of Korea"},
{n:4,c:[0,1,1],name:"Industrial Workers of the World",
 desc:"One big union, everything held in common, decided in the hall by the people who showed up — and no boss, no boss's government, and no boss's morals.",
 from:"The Industrial Workers of the World (United States, 1905) — the Wobblies. Revolutionary syndicalism organised through the union rather than the ballot.",
 also:"CNT-FAI (Catalonia, 1936)\nDie Grünen in their founding anti-statist phase\nPeace and Freedom Party (California)\nThe Zapatistas (Chiapas)"},
{n:5,c:[1,0,0],name:"America First Party",
 desc:"Open markets, closed borders, old values, and a government strong enough to protect the second two from the first. Business is free; you are not.",
 from:"The America First Party — a name that has been used more than once in American politics, most recently in 2002, and the clearest label for markets plus tradition plus a hard hand.",
 also:"Fidesz (Hungary) — the fullest working example\nIndependent Democratic Union (Chile) — the party of the Pinochet settlement\nNational Renewal (Chile)"},
{n:6,c:[1,0,1],name:"Constitution Party",
 desc:"Free markets, inherited faith, and a federal government cut back to almost nothing. Culturally traditional and radically anti-government in the same breath, which is the combination most spectrums cannot draw.",
 from:"The Constitution Party (United States, 1992) — free enterprise, Christian moral order, and the federal government confined to its enumerated powers.",
 also:"The Old Right — Robert Taft, anti-New Deal and anti-interventionist\nThe Mises Institute and the paleolibertarians\nThe Free State Project (New Hampshire)\nThe Anti-Federalists"},
{n:7,c:[1,1,0],name:"Technocracy Incorporated",
 desc:"Markets are efficient, progress is measurable, expertise is real, and voting mostly gets in the way of all three. Rule by the people who can actually do the sums.",
 from:"Technocracy Incorporated (United States, 1933) — a genuine American mass movement proposing that engineers and scientists administer the continent as a single unit.",
 also:"The Progressive Party of 1912 — Roosevelt's expert commissions\nPeople's Action Party (Singapore)\nThe network state and neo-cameralist proposals\nSaint-Simon, the original"},
{n:8,c:[1,1,1],name:"Libertarian Party",
 desc:"Let people trade, let people be, and keep the government small in both directions at once. Free markets and social permissiveness argued as one position rather than two.",
 from:"The Libertarian Party (United States, 1971) — free trade, drug legalisation, open borders and marriage equality, all from the same premise.",
 also:"D66 (Netherlands)\nFree Democratic Party (Germany)\nThe Cato Institute and Reason\nThe cypherpunks and the early internet"}];

const pid=n=>"c"+n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const edits={};let DB=null,docNote="";
const $=id=>document.getElementById(id);
const nameOf=n=>{const d=DATA.find(x=>x.n===n);return cur(d).name};

function grow(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
function cur(d){const e=edits[pid(d.n)]||{};
  return{name:e.name??d.name,desc:e.desc??d.desc,from:e.from??d.from,also:e.also??d.also,note:e.note??""}}
function dirty(d){const e=edits[pid(d.n)];if(!e)return false;
  return(e.name!=null&&e.name!==d.name)||(e.desc!=null&&e.desc!==d.desc)||
        (e.from!=null&&e.from!==d.from)||(e.also!=null&&e.also!==d.also)||!!e.note}

const diff=(a,b)=>a.c.reduce((k,v,i)=>k+(v===b.c[i]?0:1),0);
const nbrs=d=>DATA.filter(o=>o.n!==d.n&&diff(d,o)===1);
const opp=d=>DATA.find(o=>diff(d,o)===3);

function coords(c){return AXES.map(([k,vals],i)=>
  `<span class="co"><span class="k">${esc(k)}</span><span class="segs">${
    [0,1].map(j=>`<span class="sg${j===c[i]?" on":""}"></span>`).join("")
  }</span><span class="v">${esc(vals[c[i]])}</span></span>`).join("")}

function card(d){const v=cur(d),id=pid(d.n);
  return `<article class="card" id="k-${id}">
    <div class="hd"><span class="num">${d.n}</span>
      <input class="nm" id="nm-${id}" value="${esc(v.name)}" aria-label="Name of party ${d.n}">
      <span class="edited" id="ed-${id}" ${dirty(d)?"":"hidden"}>edited</span></div>
    <div class="coords">${coords(d.c)}</div>
    <div class="body">
      <div><label class="fl" for="ds-${id}">What it stands for</label>
        <textarea id="ds-${id}" rows="2">${esc(v.desc)}</textarea></div>
      <div class="two">
        <div><label class="fl" for="fr-${id}">The real party it is named for</label>
          <textarea id="fr-${id}" rows="3">${esc(v.from)}</textarea></div>
        <div><label class="fl" for="al-${id}">Others in this corner — one per line</label>
          <textarea id="al-${id}" rows="3">${esc(v.also)}</textarea></div>
      </div>
      <div class="mine"><label class="fl" for="no-${id}">Your notes</label>
        <textarea id="no-${id}" rows="1" placeholder="A better name, a different definition, anything that is wrong.">${esc(v.note)}</textarea></div>
    </div>
    <div class="rel">
      <div class="row"><span class="lb">Shares two axes with — its natural coalition</span>${
        nbrs(d).map(o=>`<b>${esc(nameOf(o.n))}</b>`).join(" · ")}</div>
      <div class="row"><span class="lb">Agrees with on nothing</span><b>${esc(nameOf(opp(d).n))}</b></div>
    </div>
    <div class="tools"><button id="rv-${id}" ${dirty(d)?"":"hidden"}>Revert to original</button></div>
  </article>`}

function render(){$("list").innerHTML=DATA.map(card).join("");
  DATA.forEach(wire);document.querySelectorAll("textarea").forEach(grow);tally()}
function tally(){const n=DATA.filter(dirty).length;
  $("tally").innerHTML=`<b>8</b> parties${n?` &nbsp;·&nbsp; <b>${n}</b> edited`:""}`}
function setStatus(t,c){const s=$("status");s.textContent=t;s.className="status "+c}

const norm=o=>JSON.stringify({name:o&&o.name,desc:o&&o.desc,from:o&&o.from,also:o&&o.also,note:o&&o.note});
const bodyOf=(o,d)=>({name:o.name??d.name,desc:o.desc??d.desc,from:o.from??d.from,also:o.also??d.also,note:o.note||""});

let timers={};
function save(id){clearTimeout(timers[id]);timers[id]=setTimeout(async()=>{
  if(!DB)return;
  try{setStatus("Saving","");
    if(id==="__doc"){await DB.doc("meta/notes").set({note:docNote,savedAt:new Date().toISOString()})}
    else{const d=DATA.find(x=>pid(x.n)===id);
      await DB.doc("parties/"+id).set({...bodyOf(edits[id]||{},d),n:d.n,savedAt:new Date().toISOString()})}
    setStatus("Saved","on")}
  catch(e){setStatus("Not saved","warn")}},700)}

function wire(d){const id=pid(d.n),E=edits[id]||(edits[id]={});
  const on=(el,f)=>el.addEventListener("input",()=>{f(el.value);grow(el);flag(d);save(id)});
  on($("ds-"+id),v=>E.desc=v);on($("fr-"+id),v=>E.from=v);
  on($("al-"+id),v=>E.also=v);on($("no-"+id),v=>E.note=v);
  const nm=$("nm-"+id);
  nm.addEventListener("input",()=>{E.name=nm.value;flag(d);save(id);names()});
  $("rv-"+id).addEventListener("click",()=>{delete edits[id];
    if(DB)DB.doc("parties/"+id).delete().then(()=>setStatus("Saved","on")).catch(()=>setStatus("Not saved","warn"));
    const el=$("k-"+id);el.outerHTML=card(d);wire(d);
    $("k-"+id).querySelectorAll("textarea").forEach(grow);names();tally()})}

function names(){DATA.forEach(d=>{const r=$("k-"+pid(d.n)).querySelector(".rel");
  r.innerHTML=`<div class="row"><span class="lb">Shares two axes with — its natural coalition</span>${
    nbrs(d).map(o=>`<b>${esc(nameOf(o.n))}</b>`).join(" · ")}</div>`+
    `<div class="row"><span class="lb">Agrees with on nothing</span><b>${esc(nameOf(opp(d).n))}</b></div>`})}

function flag(d){const id=pid(d.n),f=dirty(d);
  $("ed-"+id).hidden=!f;$("rv-"+id).hidden=!f;tally()}

render();
$("docnote").addEventListener("input",e=>{docNote=e.target.value;grow(e.target);save("__doc")});

const take=s=>{const d=s.data()||{};return{name:d.name,desc:d.desc,from:d.from,also:d.also,note:d.note}};
const typing=()=>{const a=document.activeElement;return !!(a&&a.matches&&a.matches("textarea,input"))};

(async()=>{
  if(typeof claude==="undefined"||!claude.use){setStatus("Read only — changes not kept","warn");return}
  const db=await claude.use("db");
  if(!db){setStatus("Read only — changes not kept","warn");return}
  DB=db;
  try{
    const snap=await db.collection("parties").get();
    snap.docs.forEach(s=>{edits[s.id]=take(s)});
    const m=await db.doc("meta/notes").get();
    if(m.exists){const d=m.data()||{};if(d.note){docNote=d.note;$("docnote").value=d.note}}
    render();grow($("docnote"));setStatus("Saved","on");
    db.collection("parties").onSnapshot(qs=>{
      let ch=false;
      qs.docs.forEach(s=>{const nv=take(s);if(norm(nv)!==norm(edits[s.id])){edits[s.id]=nv;ch=true}});
      if(ch&&!typing())render()
    },()=>setStatus("Not saved","warn"))
  }catch(e){setStatus("Read only — changes not kept","warn")}
})();
</script>
