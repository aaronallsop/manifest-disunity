<!--
  CONTROL BOARD TEMPLATE
  ======================
  Copy this file to docs/control-board/board.html in the project, then edit ONLY the
  BOARD object in the <script> at the bottom. The markup renders itself from that data.
  Do not hand-edit the HTML sections.

  Publish with the Artifact tool:
    file_path: docs/control-board/board.html
    capabilities: { db: {} }
    favicon: "🎛️"       (first publish only)
    url: <the address in docs/control-board/BOARD-URL.md>   (every publish after the first)

  Saved records the owner writes, which you read at the start of every session:
    read_db  db_op:"list"  collection:"decisions"          -> one doc per decision id
                                                              { status: "approved"|"commented", note, at }
    read_db  db_op:"get"   collection:"settings" doc_id:"permissions"
                                                           -> { map: { <permission id>: true|false }, at }
    comments                                               -> threads the owner sent to Claude

  Rules that live in the data, not the markup:
    - Decision ids are PERMANENT. Never rename one; a new decision gets a new id.
    - Every figure in `figures` and `numbers` is measured this session or shown as null
      (renders as "not yet measured").
    - No file paths, function names or ticket numbers anywhere in BOARD.

  ---------------------------------------------------------------------------
  LIVERIES — how a project gets its own colour
  ---------------------------------------------------------------------------
  Set `livery` in the BOARD object to one of: tower, mars, violet, deep, slate.
  Leave it out and the board uses `tower`, the Control Tower's own near-black.

  A livery retints THE GROUND and picks the STRUCTURE accent. It must never
  touch the three signal colours, because each of those means one thing on
  every board in the fleet:

      red     something is holding for you
      green   done, or running clear
      yellow  the page is warning you about its own trustworthiness

  If red became a decoration on one board, red would stop being a signal on all
  of them. So the livery blocks below set ground, ink, and accent only — the
  signals are defined once, above them, and are never overridden.

  Two things every livery has been measured against, and any new one must be:
    1. Every ink reads at 4.5:1 or better on every ground it sits on.
    2. The structure accent is at least 40 degrees of hue from all three
       signals, so structure can never be misread as a signal.

  Do not invent a livery by eye. Add it to scripts/check-livery.py in the rules
  repository, run it, and paste in the CSS it prints. It rejects a palette that
  fails either test — an amber accent, for instance, is refused because it lands
  21 degrees from the stale-warning yellow.

  Known cost of a tinted ground: on `mars` the red alerts sit on a warm ground,
  so they catch the eye slightly less than on `tower`. They stay well above the
  contrast floor, and carry a bracket and a left bar as well as their colour.
-->
<style>
/* ---------------------------------------------------------------------------
   CONTROL BOARD — painted in the Control Tower's language, so the board and the
   page it is building read as one system.
   Committed dark: this is a HUD, not a document. It paints its own ground in
   every colour and does not follow the host theme.
   The three RGB channels each mean exactly one thing, as on the Tower:
     R  holding for you      G  done / running clear      B  structure
   Acid yellow has one job: a warning about the board's own trustworthiness.
   --------------------------------------------------------------------------- */
:root{
  color-scheme:dark;

  /* SIGNALS — these mean something. A livery must never override them. */
  --r:#FF2E63; --r-soft:rgba(255,46,99,.11); --r-line:rgba(255,46,99,.45);
  --g:#00E08C; --g-soft:rgba(0,224,140,.10); --g-line:rgba(0,224,140,.42);
  --y:#FCEE0A; --y-soft:rgba(252,238,10,.09); --y-line:rgba(252,238,10,.40);

  --disp:"Chakra Petch",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ---------------------------------------------------------------------------
   LIVERIES — ground and accent only. Generated by scripts/check-livery.py and
   measured; see the note at the top of this file before adding one.
   --------------------------------------------------------------------------- */
/* tower   the default. Near-black with a blue-violet cast, as the Control Tower. */
:root{
  --void:#08090C; --deck:#0E1117; --deck-2:#141924; --sunk:#1A2030;
  --grid:#151B27; --rule:#222A3B; --rule-2:#2E3850;
  --ink:#E4E9F2; --ink-2:#97A3BA; --ink-3:#7C88A0;
  --b:#3DA9FC; --b-soft:rgba(61,169,252,.11); --b-line:rgba(61,169,252,.45);
  --glow:rgba(61,169,252,.33);
}

/* mars    dark oxide red, like rust under low light. */
[data-livery="mars"]{
  --void:#0B0605; --deck:#170D0A; --deck-2:#21130F; --sunk:#2B1A15;
  --grid:#1F120E; --rule:#3D241D; --rule-2:#523026;
  --ink:#F4E9E5; --ink-2:#C2A79F; --ink-3:#998079;
  --b:#5AB3FF; --b-soft:rgba(90,179,255,.11); --b-line:rgba(90,179,255,.45);
  --glow:rgba(90,179,255,.33);
}

/* violet  deep purple-black. */
[data-livery="violet"]{
  --void:#09070E; --deck:#120F1C; --deck-2:#191527; --sunk:#211C33;
  --grid:#171323; --rule:#2C2542; --rule-2:#3C3358;
  --ink:#EBE7F5; --ink-2:#A79FC0; --ink-3:#8983A1;
  --b:#A77BFF; --b-soft:rgba(167,123,255,.11); --b-line:rgba(167,123,255,.45);
  --glow:rgba(167,123,255,.33);
}

/* deep    deep sea. Very dark blue-green. */
[data-livery="deep"]{
  --void:#04090A; --deck:#0A1416; --deck-2:#0F1D20; --sunk:#14282C;
  --grid:#0D191C; --rule:#1E373C; --rule-2:#2A4B52;
  --ink:#E2F0F2; --ink-2:#93B0B5; --ink-3:#709196;
  --b:#3DA9FC; --b-soft:rgba(61,169,252,.11); --b-line:rgba(61,169,252,.45);
  --glow:rgba(61,169,252,.33);
}

/* slate   neutral graphite, no cast at all. */
[data-livery="slate"]{
  --void:#0A0B0C; --deck:#131517; --deck-2:#1B1E21; --sunk:#23272B;
  --grid:#17191C; --rule:#2E3338; --rule-2:#40474E;
  --ink:#E9ECEF; --ink-2:#A3ACB5; --ink-3:#868F97;
  --b:#3DA9FC; --b-soft:rgba(61,169,252,.11); --b-line:rgba(61,169,252,.45);
  --glow:rgba(61,169,252,.33);
}

*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 46px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/46px 100%,
    var(--void);
}
main{max-width:1000px; margin:0 auto; padding:26px 20px 90px}
a{color:var(--b)}
:focus-visible{outline:2px solid var(--b); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* the recurring bevelled corner */
.card,.fig,.headline{clip-path:polygon(0 9px, 9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%)}

/* ---------------- masthead ---------------- */
.masthead{position:relative; border:1px solid var(--rule); overflow:hidden;
  background:linear-gradient(180deg, var(--b-soft), transparent 62%), var(--deck);
  padding:22px 22px 18px; display:flex; flex-wrap:wrap; gap:14px 24px;
  align-items:flex-end; justify-content:space-between}
.masthead::before{content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--r) 0 33.3%, var(--g) 33.3% 66.6%, var(--b) 66.6% 100%)}
.masthead::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px)}
h1{margin:0; position:relative; z-index:1;
  font-family:var(--disp); font-size:38px; font-weight:700; line-height:.96;
  letter-spacing:.06em; text-transform:uppercase;
  text-shadow:0 0 26px var(--glow)}
.updated{position:relative; z-index:1; text-align:right;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.11em;
  line-height:2; color:var(--ink-3); text-transform:uppercase}
@media (max-width:640px){.updated{text-align:left}}

/* ---------------- section headings ---------------- */
h2{font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); margin:34px 0 11px;
  padding-bottom:7px; border-bottom:1px solid var(--rule)}

/* ---------------- measured figures ---------------- */
.figures{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule); margin-top:16px}
.fig{clip-path:none; background:var(--deck-2); padding:11px 14px 12px;
  border-left:3px solid var(--b)}
.fig b{display:block; font-family:var(--disp); font-size:27px; font-weight:700; line-height:1.1;
  color:var(--b); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.fig span{display:block; margin-top:4px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2)}

/* ---------------- the one true thing ---------------- */
.headline{margin-top:16px; padding:16px 18px; font-size:15.5px; color:var(--ink);
  border:1px solid var(--rule); border-left:3px solid var(--c, var(--b));
  background:linear-gradient(90deg, var(--c-soft, var(--b-soft)), transparent 72%), var(--deck-2)}
.headline.bad{--c:var(--r); --c-soft:var(--r-soft)}
.headline.warn{--c:var(--y); --c-soft:var(--y-soft)}
.headline.ok{--c:var(--g); --c-soft:var(--g-soft)}
.headline .lead{margin:0 0 10px; font-size:17px; line-height:1.4; color:var(--ink)}
.headline ul{margin:0; padding-left:0; list-style:none}
.headline li{margin:0; padding:9px 0 9px 15px; border-top:1px solid var(--rule);
  border-left:2px solid var(--rule-2); color:var(--ink-2); font-size:15px; line-height:1.45}
.headline li.warn{border-left-color:var(--y); color:var(--ink)}

/* ---------------- folded detail ---------------- */
details{margin-top:8px}
details > summary{cursor:pointer; list-style:none; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  padding:5px 0; user-select:none}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"▸ "; color:var(--b)}
details[open] > summary::before{content:"▾ "}
details > summary:hover{color:var(--b)}
.card ul{margin:7px 0; padding-left:18px; color:var(--ink-2)}
.card li{margin:4px 0}

/* ---------------- cards ---------------- */
.card{position:relative; background:var(--deck); border:1px solid var(--rule);
  border-left:3px solid var(--rule-2); padding:15px 17px 16px; margin-bottom:11px}
.card h3{margin:0 0 7px; font-family:var(--disp); font-size:19px; font-weight:600;
  letter-spacing:.045em; line-height:1.16; text-transform:uppercase}
.card p{margin:7px 0; color:var(--ink-2)}
.card p:first-child{margin-top:0}

/* a decision is the one thing holding for you — R, with a corner bracket */
[data-decision]{border-left-color:var(--r);
  background:linear-gradient(90deg, var(--r-soft), transparent 58%), var(--deck)}
[data-decision]::before{content:""; position:absolute; top:-1px; right:-1px;
  width:15px; height:15px; border-top:2px solid var(--r); border-right:2px solid var(--r)}

.label{display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:2px}
.quote{border-left:3px solid var(--rule-2); padding-left:11px; color:var(--ink-2);
  font-style:normal}
.twocol{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:640px){.twocol{grid-template-columns:1fr}}

/* ---------------- controls ---------------- */
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}
button{font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  padding:9px 15px; border:1px solid var(--rule-2); background:var(--sunk); color:var(--ink-2);
  cursor:pointer; transition:box-shadow .14s, color .14s, border-color .14s}
button:hover{color:var(--ink); border-color:var(--ink-3)}
button.primary{border-color:var(--b); color:var(--b); background:var(--b-soft)}
button.primary:hover{box-shadow:0 0 18px -2px var(--b)}
textarea{width:100%; font-family:var(--body); font-size:15px; padding:10px 11px;
  border:1px solid var(--rule-2); background:var(--sunk); color:var(--ink); min-height:64px}
.answer{margin-top:9px; color:var(--ink-2); font-size:14.5px}
.answered{color:var(--g); font-family:var(--mono); font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase}

/* ---------------- progress rail ---------------- */
.rail{display:flex; gap:3px; flex-wrap:wrap}
.phase{flex:1 1 140px; padding:10px 12px; border:1px solid var(--rule);
  border-top:2px solid var(--rule-2); background:var(--deck-2);
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3)}
.phase.done{border-top-color:var(--g); color:var(--g); background:var(--g-soft)}
.phase.current{border-top-color:var(--r); color:var(--r); background:var(--r-soft);
  box-shadow:0 0 18px -6px var(--r)}

/* ---------------- permissions ---------------- */
.perm{display:flex; gap:13px; align-items:flex-start; padding:12px 0;
  border-bottom:1px solid var(--rule); color:var(--ink-2); font-size:14.5px}
.perm:last-of-type{border-bottom:0}
.perm input{margin-top:4px; width:17px; height:17px; flex:none;
  accent-color:var(--b); cursor:pointer}
.risk{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  padding:3px 8px; white-space:nowrap; border:1px solid var(--rule-2);
  color:var(--ink-3); background:var(--sunk)}
.risk.med{border-color:var(--y-line); color:var(--y); background:var(--y-soft)}
.risk.high{border-color:var(--r-line); color:var(--r); background:var(--r-soft)}

/* ---------------- saving state ---------------- */
.status{margin-top:9px; min-height:1.2em; font-family:var(--mono); font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.status.bad{color:var(--r)}

/* ---------------- the record ---------------- */
.wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; border:1px solid var(--rule);
  background:var(--deck-2)}
th,td{text-align:left; padding:11px 13px; border-bottom:1px solid var(--rule);
  vertical-align:top; font-size:14px; color:var(--ink-2)}
th{background:var(--sunk); color:var(--ink-3); font-family:var(--mono); font-weight:500;
  font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; white-space:nowrap}
td:first-child{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
tr:last-child td{border-bottom:0}
</style>

<main>
  <div class="masthead">
    <h1 id="title"></h1>
    <div class="updated" id="updated"></div>
  </div>
  <div class="figures" id="figures"></div>
  <div class="headline" id="headline"></div>

  <h2>Needs a decision from you</h2>
  <div id="decisions"></div>

  <h2>What you allow while you're away</h2>
  <div class="card">
    <div id="perms"></div>
    <div class="status" id="perm-status"></div>
  </div>

  <h2>Progress</h2>
  <div class="rail" id="rail"></div>

  <h2>What was asked, and what actually happened</h2>
  <div id="phases"></div>

  <h2>Waiting on you</h2>
  <div id="blocked"></div>

  <h2>The numbers this project exists to produce</h2>
  <div class="figures" id="numbers"></div>

  <h2>What the work has found</h2>
  <div class="wrap"><table id="log"><thead><tr><th>When</th><th>Decision made on your behalf</th><th>How it turned out</th></tr></thead><tbody></tbody></table></div>
</main>

<script>
// ============================================================================
// EDIT THIS OBJECT. Nothing else.
// ============================================================================
const BOARD = {
  project: "Manifest Disunity",
  livery: "tower",                      // tower | mars | violet | deep | slate
  updated: "2026-09-15 12:10",          // when you last republished, local time

  // Three or four measured figures. value: number|string, or null = "not yet measured".
  figures: [
    { label: "Stage 2, the design documents — the current phase", value: "4 of 20" },
    { label: "Situations traced through the four documents written so far", value: 19 },
    { label: "Decisions written up this session", value: 4 },
    { label: "Stage 1 of 5 — every design round, closed by you", value: "7 of 7" },
    { label: "Tests — all green. Last run at sign-off on the 14th; no code has been touched since", value: 956 },
    { label: "Current version",         value: "v0.6" },
  ],

  // The one true thing. lead = one or two sentences. points = one line each.
  // tone: "bad" | "warn" | "ok" | "neutral".  A point with warn:true gets a yellow bar.
  headline: {
    tone: "warn",
    lead: "Everything you answered is in, and the four documents written so far have each been "
        + "walked through real situations step by step. That found five new things, all yours.",
    points: [
      "Walking the documents through real situations is the practice you reinstated, and it paid on the first try.",
      { warn: true, t: "Deseret's only route to any market runs through Riverside - a small landlocked neighbour nobody had ever mentioned. Your recognition exception may not cover it." },
      { warn: true, t: "The first turn of the game has nothing in it. The loop we built is triage, and on turn 1 there is nothing to triage." },
      { warn: true, t: "You ruled missions permanent. That did not rule the REWARDS permanent, and the two are different questions." },
      "Your three-axis politics is now the design rather than a contradiction, and audio is out of scope rather than an oversight.",
      "Four of twenty documents written. Sixteen to go, and fifteen of those I can write without you.",
    ],
  },

  // Only decisions that are genuinely the owner's. Ids are permanent.
  // A card shows the recommendation; the evidence and the cost fold behind it.
  // Write evidence and cost as ARRAYS and they render as bullets.
  decisions: [
    {
      id: "mission-reward-permanence",
      title: "You finish a mission, then lose the ground that earned it. Does the bonus go?",
      recommendation: "The bonus should lapse with the ground, and the completed mission should stay green. My reasoning is that you ruled missions permanent for MOMENTUM - so a player can plan against a tree that does not flicker - and momentum is about the tree, not about the arithmetic. But this is a fork you should look at, because the other side has a real argument and I am not confident.",
      evidence: [
        "You ruled that a completed mission stays completed, even if the ground changes hands. That was for momentum: a tree whose rungs switch on and off cannot be planned against.",
        "But that ruled the MISSION permanent. It did not rule the REWARD permanent, and tracing found they are different questions.",
        "A reward is a named line on your country's scorecard, like a leader's trait. Some of them will be tied to holding a specific place - the Houston Ship Channel, a set of Great Lakes ports.",
        "So a bonus that says 'because you hold the Ship Channel' has to decide what it means when you no longer hold it.",
      ],
      cost: [
        "If the bonus survives: a country collects permanent advantages from ground it lost. That is exactly the runaway-leader problem the rest of the game spends its time preventing - and a player who works this out will take a city, bank the bonus, and hand the city back.",
        "If the bonus lapses: the tree stops flickering and the bonuses still do, so your momentum argument is only half delivered. A player watching a bonus wink out has the experience you ruled against.",
        "There is a third way I did not recommend because it is more machinery: bonuses that are about a PLACE lapse, bonuses that are about an ACHIEVEMENT do not. It is probably right and it is definitely more to build.",
      ],
    },
    {
      id: "shared-tree-race-or-checklist",
      title: "Two countries share a mission tree and both hit the same target. Do both get it?",
      recommendation: "Make it a race - first only. You designed shared trees precisely because the countries are rivals for one prize, and a race is what makes one tree into two games. A checklist would let Minnesota and Wisconsin both tick the same box while pretending to compete.",
      evidence: [
        "The five Texan successors share one tree because they are five claimants to one prize. Minnesota and Wisconsin share one because they are two candidates to lead the same union.",
        "Your own words for why that works: the tree is the same and the situation is not, which is what makes one tree two games.",
        "The game checks mission conditions over EVERY country every turn, not just yours. So two rivals meeting the same condition is the normal case, not a freak collision.",
        "It is especially likely for the Great Lakes pair, because a condition can be met through a federation they both belong to - so they could satisfy it on the same turn by the same act.",
      ],
      cost: [
        "A race: the loser watches a rung they were working toward go permanently dark on somebody else's country. That is sharp and it is the point - but it means a tree can become unfinishable through no mistake of yours.",
        "A checklist: nobody is ever locked out, and the rivalry you designed the shared tree to express quietly stops existing.",
        "Either way something has to be said about what the loser sees, and nothing currently specifies whether you can even see a rival's tree.",
      ],
    },
    {
      id: "turn-one",
      title: "What does the very first turn offer somebody who has never played this?",
      recommendation: "Give the opening turn something already in motion - a project your predecessor started, or the first rung of a mission tree sitting one action away. My reasoning is that it costs no new machinery and it makes turn 1 look like turn 40, which is the turn the whole design is written for.",
      evidence: [
        "The old one-action rule was bad, but it told a newcomer two things free: what a turn was for, and when they had finished one. Removing it removed both.",
        "The loop you and I built is triage - things arrive, you rank them, you deal with what matters. On turn 1 there is nothing to triage. No project running, nobody has answered an offer, no movement has demanded anything.",
        "So the first turn is the one turn where the game's central experience has no material in it.",
        "This is not an argument for putting the action budget back, and it is not something the screens can fix on their own.",
      ],
      cost: [
        "Doing nothing: a new player opens the game, reads a newspaper, and is handed a map with no indication of what a turn is for. That is the moment most people decide whether to play a second one.",
        "A running project: costs nothing to build, and makes the first thing a player sees a bar filling - which is the payoff loop working on turn 1 instead of turn 5.",
        "The alternative I rejected: a tutorial. You have never asked for one, it is a lot of work, and the game you are modelling this on does not have a good one either.",
      ],
    },
    {
      id: "deseret-recognition-riverside",
      title: "Your Deseret exception may not cover the country it needs to",
      recommendation: "Extend it explicitly to whoever holds San Bernardino - which today is Riverside. You made the exception so a country that needs a trade corridor could actually be granted one; tracing the map shows the only country that can grant Deseret a useful one is the one nobody has mentioned.",
      evidence: [
        "You ruled Deseret opens recognised by its neighbours and not by Utah, so a pariah needing passage could be given it. That was checked against the numbers and never against the map.",
        "Deseret is the only completely sealed country on the board: no port, no coast, no border crossing, no navigable river, in any of its fifty-seven areas.",
        "It touches California through exactly ONE area - Mohave County - looking across at San Bernardino.",
        "San Bernardino belongs to Riverside, not to the San Diego country as its own description implies. Riverside is landlocked but holds Imperial County, which is a Mexican border crossing.",
        "So Deseret's shortest route to any market on earth is through Riverside, and the ocean is one step further.",

            + "You set a fixed gap between them, and that gap is the whole middle act of the game.\n\n"
            + "THE BIGGEST THING YOU DECIDED WAS NOT ABOUT DIPLOMACY. You ruled that the board should "

            + "WHAT THE TEST STORY FOUND, AND IT IS THE WORST THING IN THE ROUND. A brand-new country "

            + "AND I CHECKED MY OWN WORK BEFORE CALLING IT FINISHED, which found five things wrong. "

    { name: "Design round 6 — Shocks nobody chose", status: "done",
      brief: "Things that happen that nobody chose. It went last on purpose: you cannot design a shock "
           + "before you know what it is shocking.",
      actual: "RAN TONIGHT, and it is the most restrained round of the seven. Seventy-four ideas, "
            + "seven decisions, six findings — and its test story was traced BEFORE any decision was "
            + "made rather than after, which is the first time a round has worked in that order.\n\n"
            + "WHAT WAS WRONG AT THE START. The twelve crises the game already has are every one "
            + "triggered by a country's OWN condition, so there was no way to make anything true for "
            + "more than one country at a time — which means the oil stoppage from your story, the one "
            + "that hit everybody at once, had nothing to be true of.\n\n"
            + "You answered it with a place rather than a world: a shock happens somewhere on the map "
            + "and reaches everything near it, and a country feels it in proportion to the ground it "
            + "holds inside it. That needed no new layer above the countries at all, which the other "
            + "three answers on the card would have.\n\n"
            + "Two costs, both found by checking rather than assuming. The map has NO COORDINATES "
            + "anywhere — counties carry a name, a state, population, output and votes — so a blast "
            + "radius is walked county by county rather than measured in miles. That is cheap, it is "
            + "already built, and it is arguably truer: a drought spreads along the plains rather than "

            + "the whole board, so one winter would take three turns to deliver — the delivery has to "
            + "learn to address a group.\n\n"
            + "You also ruled that no CHAIN of events runs in play: the nine links of the break-up are "
            + "the backstory's job. That one restraint deleted the entire remaining half of the round "
            + "and nothing that matters was lost. And the game will open on a newspaper front page "
            + "dated 1 March 2036 — prose with no engine work behind it, and the first thing a new "

    { name: "Stage 2 — The design documents", status: "current",
      brief: "One document per system: what the thing actually does, what it is measured in, what the "
           + "player sees, and what happens at each level. Your plan puts this between the ideas and "
           + "the numbers.",
      actual: "TWO OF TWENTY WRITTEN, both today. It turned out not to be seven documents — it is a "
            + "short master document and nineteen beside it, because the reader is one technical "
            + "designer taking one system at a time, and they should never have to read a system they "
            + "are not writing.\n\n"
            + "THE TURN IS DONE, and it was rebuilt from nothing. You said you did not want the "
            + "one-action-per-turn game. Before changing it I checked whether anyone had ever chosen "
            + "it: there is no record of that decision anywhere in two hundred and sixteen of them. A "
            + "programmer put it in when you gave him a free hand and it stuck, and seven rounds of "
            + "design then wrote their complaints underneath it as though it were a rule.\n\n"
            + "What replaced it is yours, from Civ2 and EU4: start as many things as you like, almost "
            + "nothing finishes this quarter, and the things that do are a card you click. Money and "
            + "time are the limits and no rule anywhere says no. Nine questions that five rounds had "
            + "parked on this all dissolved, because the currency they were priced in stopped "
            + "existing.\n\n"
            + "MISSIONS ARE DONE TOO, AND THE GAME HAD NONE. Seven rounds produced 536 ideas without a "
            + "single goal among them — three ways to win, checked every turn, and nothing telling a "
            + "player what to work on this decade. There are now three trees: Texas, Deseret, and "
            + "Minnesota-or-Wisconsin. Every condition in them was checked against the real map before "
            + "it was written down.\n\n"
            + "THE MASTER IS NOW WRITTEN TOO — 15 September. It is the short one at the top: what "
            + "this game is, who it is for, what it feels like, what makes it different, how all the "
            + "parts connect, and the handful of ideas every other document has to share so nobody "
            + "guesses. SIX OF ITS FIFTEEN SECTIONS ARE DRAFTS FOR YOU, because they were missing "
            + "from the whole project — nobody had ever written down what this game IS, as opposed "
            + "to how its parts work. They are marked as mine, not presented as settled.\n\n"
            + "IT ALSO SETTLED YOUR PROGRESS COUNTER, which had been telling you two different "
            + "things. One record said eighteen parts, this board said nineteen. Both were right "
            + "when they were written: the structure proposed at half past three in the morning had "
            + "eighteen, and mission trees did not exist as an idea until two hours later. The "
            + "missions document is a nineteenth that nobody added to the list — and the list had "
            + "never been written down anywhere, which is the only reason it survived.\n\n"
            + "AND YOU APPROVED THE STRUCTURE, a day after being asked. Your second reason turned "
            + "out to be worth more than the answer: a design document is never finished, so a fat "
            + "one now becomes an obese one later. That makes nineteen a FLOOR rather than a "
            + "ceiling — when a part outgrows itself it gets split, never merged. The first one that "
            + "will need it is already named, along with the thing that should trigger it.\n\n"
            + "AND THE BOARD ITSELF IS WRITTEN — 15 September, the fourth of twenty. Geography as "
            + "a network with prices on it: the map's atoms, what it costs an army to cross ground, "
            + "how far a country can reach before distance simply refuses it, the four rivers and "
            + "their fifteen gates, the two oceans with the canal shut between them, and the whole "
            + "business of moving goods across somebody else's land. Almost all of it is already "
            + "built, so the job was carrying a working system across exactly rather than inventing "
            + "one.\n\n"
            + "FOUR THINGS IT FOUND BY COUNTING RATHER THAN COPYING. The ports figure I gave you on "
            + "the 5th was wrong and is corrected in the log below. A set of 213 river-bank pairs is "
            + "baked into your data every time and read by nothing at all. The border with Canada "
            + "and Mexico is written down in two separate files that happen to agree. And a wrecked "
            + "rail hub still lasts one turn, which makes it a raid rather than a demolition — "
            + "nobody chose that, and it is now a question with your name on it.\n\n"
            + "AND ALL FOUR HAVE NOW BEEN WALKED THROUGH REAL SITUATIONS, step by step, which is "
            + "the practice you reinstated today. Nineteen situations. It found eight things the "
            + "rulings alone had not, and five of those are cards above waiting for you. The one "
            + "that justifies the whole practice: Deseret is the only completely sealed country on "
            + "the board - no port, no coast, no border crossing, no river - and its single route "
            + "to any market on earth runs through one area of Arizona into a small landlocked "
            + "neighbour called Riverside that nobody in this project had ever mentioned.\n\n"
            + "WHAT IS LEFT: sixteen documents. Two measurements instead of none and still no "
            + "total from me — the turn had almost no material behind it and the big systems carry "
            + "forty rulings each. What I can say is that the seven idea documents run to 11,725 "
            + "lines, and a design stage converts an idea stage, so the answer is the same order of "
            + "size." },
    { name: "Design round 7 — The frame above everything", status: "done",
      brief: "What winning means, how the turn is spent, what a country is allowed to know, and time. "
           + "Collected as a running list through the six rounds before it, and resolved last.",
      actual: "RAN TONIGHT. Fifty ideas, four decisions, four findings, and the largest in-tray of any "

    { name: "Design round 4 — The economy", status: "done",

  // Decisions made on the owner's behalf and how they turned out. Corrections go BESIDE originals.
  log: [
    { when: "2026-09-15", decision: "CORRECTION, beside the entry of 5 September below: I told you there were 986 ports. There are 136.",
      outcome: "Found while writing the geography document, by counting rather than by repeating the figure. On 5 September I wrongly said the county data had no ports, then corrected myself to 986 — and that correction was also wrong. 986 is how many COUNTIES carry any trade geography at all; the ones with a port are 136, and the real Principal Ports dataset holds 150 port facilities. Nothing was built on the wrong number, because the game counts the ports themselves rather than reading my figure. Left beside the original rather than over it, because a log that can be quietly revised is worth nothing. And the honest finding underneath it is better than the correction: of those 136 ports, 57 are ocean, 20 are on the Great Lakes and 59 are river or inland ports that reach no foreign market at all. Forty-three per cent of the ports in this game cannot export anywhere, which is why having a port and being able to sell abroad are two different questions." },
    { when: "2026-09-15", decision: "Checked whether the rule you wanted removed had ever been decided, before removing it.",
      outcome: "You said you did not want the one-action-per-turn game and asked whose question it was. Rather than answer that, I went looking for the moment it was chosen. It is not in any of your two hundred and sixteen decisions — every single mention of it in the record is a complaint about it or a deferral of it. It arrived in the code when you gave a programmer a free hand, and then seven rounds of design wrote their objections underneath it as though it were a rule somebody had thought about. That changed the answer to your question: what had been handed forward as a technical matter turned out to be an accident nobody owned, and it came back to the design table." },
    { when: "2026-09-15", decision: "Told you a recommendation of mine was too strict, an hour after making it.",
      outcome: "I told you a mission must never hand you a bonus on one of the country's scores — that it should only ever unlock something — on the grounds that every number in this game explains itself and an unexplained one would be the first. Then you sent your Texas missions and every one of them had exactly that kind of bonus on it. Checking rather than arguing: the game already does this. A leader is a named person whose traits nudge those same five scores, and the panel prints each one as its own labelled line. So the rule is not no — it is that the bonus must appear with its name on it. Your instinct was right and mine was half a rule." },
    { when: "2026-09-15", decision: "Fixed three numbers your own design document disagreed with itself about — by measuring, not by choosing.",
      outcome: "Reading it end to end for the first time in a while, it contradicted itself in three places: the map was 1,676 counties-grouped-into-areas in one section and 1,688 in another, the tuning dials were 142 in one place and 298 in another, and the test count was 824 against the 956 you were told at sign-off. It would have been quicker to pick the newer number each time. I counted instead: the map is 1,688, the dials are 370, and the tests are 956 across 51 files. Two of the three had drifted past BOTH figures. Where I could not re-measure something honestly — the shape of the map's connection graph, and how many dials cite a real measurement — I marked it stale rather than overwriting it with a guess." },
    { when: "2026-09-14", decision: "Marked 39 of your live rules as dead, and shipped it to the person you were paying to read them.",
      outcome: "The single worst thing I have done on this project. The wiki prints, beside every rule, whether a later ruling replaced it. My check searched the note about each rule for the word \"superseded\" — and most of those notes open with the words \"Not superseded.\" It read the denial as a confirmation. Your writer spotted it, said so on six separate pages of their questions file, and carried on drafting against it anyway. The true number is six. What makes it worse is that my own instructions to that writer name this exact failure as the worst thing the wiki could do. Fixed, tested against eight known cases, and written up as rule 12: a check that decides whether something is still true has to be run over every row of the real data and read, before it ships." },
    { when: "2026-09-14", decision: "Reviewed my own week's work hard enough to find 45 real defects in it, before telling you it was finished.",
      outcome: "Sixty-one reviewers over four angles — the generator, the data, the map, and the documents — each told to attack rather than approve, and each finding then given to a second reviewer told to refute it. 57 raised, 12 thrown out as wrong, 45 confirmed. Nine fixed tonight, twenty written down. Three would have reached you as false statements in the wiki. One would have destroyed your writer's work the next time I rebuilt: quoting one of my own markers at the start of a line made the rebuild swallow everything down to the next one. Nothing has been lost, and the rebuild now refuses to touch a page whose markers it cannot read cleanly." },
    { when: "2026-09-14", decision: "Told you the graph view could not be made to do what you wanted, rather than trying to tune it.",
      outcome: "You opened the node graph and got a hairball. I measured why instead of guessing: only 6 per cent of the links say one thing is part of another, your eleven categories are invisible to that view because it reads links and nothing else, and the front page alone links to 79 of 86 pages — which puts every page two steps from every other page through one hub. No setting fixes that. The richest thing in the data was being thrown away at the moment of drawing: every link already knows whether it gates, feeds, blocks, costs, triggers or explains, and all seven were painted the same grey. So I built the picture separately, and it keeps them apart." },
    { when: "2026-09-14", decision: "Brought your Movement Register into the project as a file, without asking first.",
      outcome: "Every movement's verb — what it actually wants — existed only on a published web page outside the repository, and it is the thing your three closed rounds rule on more than anything else. No movement page could state its own verb. I read your live markup rather than the page's defaults, which matters: four verbs differ between them. Blue-Collar Populist and Christian Nationalism gained Unify where the default had none, and Front Range Republic and Hawaiian Sovereignty moved to Expand — the second because of Pearl Harbor, in your own note." },
    { when: "2026-09-14", decision: "Corrected three counts in your own planning documents that had gone stale.",
      outcome: "The seven-round plan and the standing brief both still said politics was half-finished at 14 rulings when it had closed at 41, and you had approved the closure on this board. While in there I counted the idea banks rather than copying the figures forward: the economy holds 93 entries, not 84, and conquest holds 127, not 134 — its numbering runs to C131 with four numbers never used and two used twice. Three different numbers had been circulating for the same document." },
    { when: "2026-09-14", decision: "Wrote a build/ exception into the designer brief instead of quietly breaking its rule.",

    { when: "2026-09-09", decision: "Told you round two was already finished, instead of starting the work you asked for.",

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v) => (v === null || v === undefined || v === "") ? "not yet measured" : v;

function render() {
  document.documentElement.dataset.livery = BOARD.livery || "tower";
  document.title = BOARD.project + " — Control Board";
  $("title").textContent = BOARD.project;
  $("updated").textContent = "Updated " + BOARD.updated;
  $("figures").innerHTML = BOARD.figures.map(f => `<div class="fig"><b>${esc(fmt(f.value))}</b><span>${esc(f.label)}</span></div>`).join("");
  const hd = BOARD.headline, h = $("headline");
  h.className = "headline " + (hd.tone || "");
  if (hd.points) {
    h.innerHTML = `<p class="lead">${esc(hd.lead)}</p><ul>${hd.points.map(p =>
      `<li class="${p.warn ? "warn" : ""}">${esc(p.t || p)}</li>`).join("")}</ul>`;
  } else { h.textContent = hd.text; }

  const body = (v) => Array.isArray(v)
    ? `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
    : `<p>${esc(v)}</p>`;
  $("decisions").innerHTML = BOARD.decisions.length ? BOARD.decisions.map(d => `
    <div class="card" data-decision="${esc(d.id)}">
      <h3>${esc(d.title)}</h3>
      ${d.recommendation ? `<p><span class="label">My recommendation</span><br>${esc(
          Array.isArray(d.recommendation) ? d.recommendation[0] : d.recommendation)}</p>` : ""}
      <details><summary>Why, and what it costs either way</summary>
        <span class="label">Evidence</span>${body(d.evidence)}
        <span class="label">Cost either way</span>${body(d.cost)}
      </details>
      <div class="answer"></div>
      <textarea placeholder="Your note (optional)"></textarea>
      <div class="row"><button class="primary" data-act="approved">Approve</button><button data-act="commented">Comment</button></div>
      <div class="status"></div>
    </div>`).join("") : `<div class="card"><p>Nothing is waiting on you. That is the correct state.</p></div>`;

  $("perms").innerHTML = BOARD.permissions.map(p => `
    <label class="perm"><input type="checkbox" data-perm="${esc(p.id)}">
      <div><b>${esc(p.label)}</b> <span class="risk ${esc(p.risk)}">${esc(p.risk)} risk</span><br><span style="color:var(--muted)">${esc(p.desc)}</span></div></label>`).join("");

  $("rail").innerHTML = BOARD.phases.map(p => `<div class="phase ${esc(p.status)}">${esc(p.name)}</div>`).join("");
  $("phases").innerHTML = BOARD.phases.map(p => `
    <div class="card"><h3>${esc(p.name)}</h3>
      <details><summary>The brief, and what actually happened</summary><div class="twocol">
        <div><span class="label">The brief said</span><p class="quote">${esc(p.brief)}</p></div>
        <div><span class="label">What actually happened</span><p>${esc(p.actual)}</p></div>
      </div></details></div>`).join("");

  $("blocked").innerHTML = BOARD.blocked.length ? BOARD.blocked.map(b => `
    <div class="card"><h3>${esc(b.what)}</h3>
    ${b.damagedIfAutomated ? '<p><span class="risk high">actively damaged if automated</span></p>' : ''}
    <details><summary>If a machine supplies it instead</summary><p>${esc(b.ifAutomated)}</p></details></div>`).join("")
    : `<div class="card"><p>Nothing is blocked on you.</p></div>`;

  $("numbers").innerHTML = BOARD.numbers.map(n => `<div class="fig"><b>${esc(fmt(n.value))}</b><span>${esc(n.label)}</span></div>`).join("");
  $("log").querySelector("tbody").innerHTML = BOARD.log.length ? BOARD.log.map(l =>
    `<tr><td>${esc(l.when)}</td><td>${esc(l.decision)}</td><td>${esc(l.outcome)}</td></tr>`).join("")
    : `<tr><td colspan="3" style="color:var(--muted)">Nothing recorded yet.</td></tr>`;
}

// ---- persistence (db capability) -------------------------------------------
let db = null;
async function wire() {
  render();
  try { db = await claude.use("db"); } catch (e) { db = null; }
  const ps = $("perm-status");
  if (!db) {
    ps.className = "status bad";
    ps.textContent = "Saving is unavailable in this view. Your ticks and answers will NOT be recorded.";
    document.querySelectorAll("[data-decision] .status").forEach(s => { s.className = "status bad"; s.textContent = "Saving unavailable — your answer will not reach Claude."; });
    return;
  }
  // permissions
  const permRef = db.doc("settings/permissions");
  permRef.onSnapshot(snap => {
    const map = (snap.exists && snap.data().map) || {};
    document.querySelectorAll("[data-perm]").forEach(cb => { cb.checked = !!map[cb.dataset.perm]; });
    ps.className = "status"; ps.textContent = snap.exists ? "Saved " + (snap.data().at || "") : "Nothing saved yet.";
  }, e => { ps.className = "status bad"; ps.textContent = "Could not load saved permissions (" + e.code + ")."; });
  document.querySelectorAll("[data-perm]").forEach(cb => cb.addEventListener("change", async () => {
    const map = {}; document.querySelectorAll("[data-perm]").forEach(c => map[c.dataset.perm] = c.checked);
    try { await permRef.set({ map, at: new Date().toISOString() }); ps.className = "status"; ps.textContent = "Saved."; }
    catch (e) { ps.className = "status bad"; ps.textContent = "Not saved (" + e.code + "). Try again."; }
  }));
  // decisions
  document.querySelectorAll("[data-decision]").forEach(card => {
    const id = card.dataset.decision, ref = db.doc("decisions/" + id);
    const st = card.querySelector(".status"), ans = card.querySelector(".answer"), ta = card.querySelector("textarea");
    ref.onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); ans.innerHTML = `<p class="answered">You ${esc(d.status)} this on ${esc((d.at||"").slice(0,16).replace("T"," "))}${d.note ? " — “" + esc(d.note) + "”" : ""}</p>`; }
      else ans.innerHTML = "";
    }, e => { st.className = "status bad"; st.textContent = "Could not load your answer (" + e.code + ")."; });
    card.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", async () => {
      try { await ref.set({ status: btn.dataset.act, note: ta.value.trim(), at: new Date().toISOString() }); st.className = "status"; st.textContent = "Saved. Claude will read this at the start of the next session."; ta.value = ""; }
      catch (e) { st.className = "status bad"; st.textContent = "Not saved (" + e.code + "). Try again."; }
    }));
  });
}
wire();
</script>
