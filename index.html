<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nation States &mdash; 50 states, 50 nations</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <h1>Nation States</h1>
          <span class="tagline">What if every U.S. state became its own nation?</span>
        </div>

        <div class="toggle-group">
          <span class="tg-label">Select</span>
          <div class="toggle" role="group" aria-label="Selection mode">
            <button data-mode="nations" class="active">Nations</button>
            <button data-mode="counties">Counties</button>
          </div>
        </div>

        <div class="toggle-group">
          <span class="tg-label">Map</span>
          <div class="color-toggle" role="group" aria-label="Map coloring">
            <button data-color="standard" class="active">Standard</button>
            <button data-color="pressure">Pressure</button>
            <button data-color="political">Political</button>
            <button data-color="gdp">GDP</button>
            <button data-color="population">Population</button>
            <button data-color="geographic">Geographic</button>
            <button data-color="cultural">Culture</button>
            <button data-color="economy">Economy</button>
          </div>
        </div>

        <div class="toggle-group">
          <span class="tg-label">Lines</span>
          <div class="toggle" role="group" aria-label="County lines">
            <button id="btn-clines" title="Show the individual county lines inside merged Areas">County lines</button>
          </div>
        </div>

        <div class="toggle-group">
          <span class="tg-label">Game</span>
          <div class="savebar">
            <button id="btn-save">&#128190; Save</button>
            <button id="btn-load">&#128194; Load</button>
            <button id="btn-editor">&#128506; Enter map editor</button>
          </div>
        </div>
      </header>

      <div id="turnbar"></div>

      <main>
        <aside id="leaderboard"></aside>
        <div id="map">
          <div class="loading" id="loading">Loading map&hellip;</div>
          <div class="legend" id="legend"></div>
          <div class="toast" id="toast"></div>
        </div>
        <aside id="panel"></aside>
      </main>
    </div>

    <div id="modal"><div class="modal-card"><div class="modal-body"></div></div></div>

    <!-- The end of the game. Empty until there is one. -->
    <div id="endscreen"><div class="end-card"></div></div>

    <!-- Who you are. Shown once, before a fresh game. -->
    <div id="startscreen"><div class="start-card"></div></div>

    <script type="module" src="js/boot-globals.js"></script>
    <script src="lib/d3.v7.min.js"></script>
    <script src="lib/topojson-client.min.js"></script>
    <script src="js/colors.js"></script>
    <script src="js/game.js"></script>
    <script src="js/movements.js"></script>
    <script src="js/civilwar.js"></script>
    <script src="js/mapmodes.js"></script>
    <script src="js/turns.js"></script>
    <script src="js/moves.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/victory.js"></script>
    <script src="js/factions.js"></script>
    <script src="js/military.js"></script>
    <script src="js/relations.js"></script>
    <script src="js/coalitions.js"></script>
    <script src="js/events.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/ledger.js"></script>
    <script src="js/sentiment.js"></script>
    <script src="js/world.js"></script>
    <script src="js/market.js"></script>
    <script src="js/app.js"></script>
    <script src="js/saves.js"></script>
    <script src="js/editor.js"></script>
  </body>
</html>
